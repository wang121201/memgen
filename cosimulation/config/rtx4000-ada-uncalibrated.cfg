# RTX 4000 Ada nominal GDDR6 parameters in the latest generic banked core.
# Intended model identity: GDDR6 / GENERIC_BANKED_SUBSET.
# Qualification: EXPLICIT_UNCALIBRATED_GDDR6_SERVICE_MODEL.
# JEDEC_controller_validated=false; hardware_timing_calibrated=false.
# chip_identity_verified=false; physical_GPU_mapping_recovered=false.
# Source profile: work/gddr6-support/coupled_norm_gddr6/profiles.json,
# memory_model.gddr6, SG_GDDR6_PROFILE_V1. No GPU measurements are replaced.
# Core revision: d7a2ca64614a6d9ce8d7a69beb77ce78b66df1a8.
#
# This file is a numeric parameter overlay for HbmDevice. Its class, tier,
# standard field and raw HBFSIM receipts still identify HBM / JEDEC HBM4.
# The accepted hbm-standard below is the CORE'S fixed identity, not a claim
# that the intended GDDR6 model is JEDEC HBM4 or that GDDR6 is implemented.
# Do not relabel raw core receipts or claim this is an official GDDR6 device.
# Consume only the resolved HBM component in the direct GTSim adapter;
# other SystemConfig devices and policies are outside this overlay's scope.
hbm-standard=JEDEC-JESD270-4-2025-04

# Board bounds: NVIDIA's desktop RTX 4000 Ada datasheet gives 160-bit DQ,
# 360 GB/s nominal shared read/write bandwidth and 20 GB GDDR6 with ECC.
# 18.00 Gb/s/pin is derived from the board bounds, not a measured clock.
# 10 logical x16 channels, one internal stack/pseudo-channel, 4x4 banks,
# 4096-byte rows and exact 20 GiB capacity are explicit MODEL choices.
# They do not establish chip part, PCB topology, usable capacity or ECC mode.
hbm-capacity-bytes=21474836480
hbm-stacks=1
hbm-channels=10
hbm-pseudo-channels=1
hbm-bank-groups-per-pseudo-channel=4
hbm-banks-per-group=4
hbm-channel-row-size-bytes=4096
hbm-channel-width-bits=16
hbm-burst-length=16
hbm-pin-rate-gbps=18.00
hbm-data-rate-per-command-clock=8

# Every AC timing is copied explicitly from the existing uncalibrated
# profile. These are product/controller assumptions, not vendor speed-bin
# data. Values ending -ns are nanoseconds; tCCD values are command cycles.
hbm-address-mapping-ns=0.00
hbm-trcdrd-ns=14.00
hbm-trcdwr-ns=14.00
hbm-tcl-ns=14.00
hbm-tcwl-ns=10.00
hbm-trp-ns=14.00
hbm-tras-ns=32.00
hbm-trc-ns=46.00
hbm-twr-ns=15.00
hbm-trtp-ns=7.50
hbm-tccd-s-cycles=2
hbm-tccd-l-cycles=4
hbm-trrd-s-ns=4.00
hbm-trrd-l-ns=6.00
hbm-tfaw-ns=20.00
hbm-twtr-s-ns=4.00
hbm-twtr-l-ns=8.00
hbm-trtw-ns=8.00
hbm-frfcfs-cap-ns=5000.00

# Preserve old profile refresh=disabled. These inactive positive timings
# are mandatory constructor inputs and are not a GDDR6 refresh validation.
# Inactive tRFCsb explicitly mirrors tRFC, matching the old adapter.
# Do not enable HBM same-bank refresh and call it GDDR6 per-bank refresh.
hbm-refresh=false
hbm-same-bank-refresh=false
hbm-trefi-ns=1953.125
hbm-trfc-ns=350.00
hbm-trfcsb-ns=350.00
hbm-trrefd-ns=10.00
hbm-queue-depth=32

# Latest-core policy choices absent from the old GDDR6 profile:
# explicitly select its default 256-byte interleave and disable symmetric
# host-time replication for initial verification. The core's fixed mapping
# is pch-interleave-bg-rotate-v2, NOT the recovered GPU bank/channel hash.
# This mapping is not promised to match the previously frozen core.
# There is no compiled_span_acceleration parameter in this core revision.
hbm-interleave-bytes=256
hbm-replicate-symmetric-pseudo-channels=false

# GTSim-only fields (SM clock, internal miss latency, max_live, credits per
# PC, SIMD/SFU/SHFL parameters) stay in the GTSim adapter configuration.
# They are not HBFSIM device settings and must not be put into this parser.
